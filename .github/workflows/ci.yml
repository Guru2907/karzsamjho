name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - run: python -m pytest -q
      - name: Bot imports
        run: python -c "import bot.main"

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  secrets:
    name: No keys committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for API keys and .env
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env is committed. Remove it and rotate the keys."; exit 1
          fi
          if git grep -nE 'gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}'; then
            echo "::error::An API key or bot token is in the code. Remove it and rotate the key."; exit 1
          fi
          echo "No keys found."